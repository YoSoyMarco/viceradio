<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vice City Radio Player</title>
    
    <meta name="theme-color" content="#120024">
    <meta name="description" content="Reproductor de Emisoras de Radio al estilo GTA Vice City para archivos locales MP3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VC Radio">
    
    <script>
        const manifest = {
            "name": "Vice City Radio Player",
            "short_name": "VC Radio",
            "description": "Reproductor de Radio GTA Vice City para almacenamiento local Android",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#120024",
            "theme_color": "#ff007f",
            "icons": [
                {
                    "src": "https://img.icons8.com/color/512/radio.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const linkElem = document.createElement('link');
        linkElem.rel = 'manifest';
        linkElem.href = manifestURL;
        document.head.appendChild(linkElem);
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vicePink: '#ff007f',
                        viceCyan: '#00f0ff',
                        vicePurple: '#240046',
                        viceDark: '#0a0014',
                        viceYellow: '#ffea00'
                    },
                    fontFamily: {
                        retro: ['Courier New', 'Courier', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Press+Start+2P&family=Titillium+Web:wght@700;900&display=swap');

        body {
            background-color: #0a0014;
            color: #ffffff;
            font-family: 'Titillium Web', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .vice-title {
            font-family: 'Pinyon Script', cursive;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f;
        }

        .digital-font {
            font-family: 'Press Start 2P', monospace;
        }

        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .glow-pink {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }
        .glow-cyan {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
        .text-glow-pink {
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8);
        }
        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #120024;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff007f;
            border-radius: 3px;
        }

        .station-card.active {
            border-color: #00f0ff;
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.3), rgba(0, 240, 255, 0.2));
            transform: scale(1.02);
        }

        @keyframes pulseBar {
            0% { height: 20%; }
            50% { height: 100%; }
            100% { height: 20%; }
        }
        .equalizer-bar {
            animation: pulseBar 0.6s infinite ease-in-out alternate;
        }
    </style>
</head>
<div class="relative min-h-screen flex flex-col justify-between overflow-x-hidden pb-8">
    
    <div class="fixed inset-0 scanlines z-50"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-viceDark via-vicePurple to-viceDark -z-10 opacity-90"></div>

    <header class="w-full pt-6 pb-4 px-4 text-center border-b border-vicePink/30 bg-black/40 backdrop-blur-md">
        <h1 class="vice-title text-5xl md:text-6xl text-vicePink transform -rotate-3 leading-tight">
            Vice City
        </h1>
        <h2 class="text-xs md:text-sm uppercase tracking-widest text-viceCyan font-bold mt-1 text-glow-cyan">
            Radio Station Tuner
        </h2>
    </header>

    <main class="w-full max-w-4xl mx-auto px-4 py-4 flex-grow flex flex-col gap-6">

        <section class="bg-black/70 border-2 border-viceCyan/70 rounded-2xl p-4 md:p-6 glow-cyan flex flex-col md:flex-row items-center justify-between gap-4 relative overflow-hidden">
            <div class="absolute inset-0 bg-[linear-gradient(to_right,#00f0ff10_1px,transparent_1px),linear-gradient(to_bottom,#00f0ff10_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none"></div>

            <div class="z-10 text-center md:text-left flex-grow">
                <div class="flex items-center justify-center md:justify-start gap-2 mb-1">
                    <span class="inline-block w-3 h-3 rounded-full bg-vicePink animate-ping" id="liveIndicator"></span>
                    <span class="digital-font text-xs text-viceYellow tracking-wider" id="freqDisplay">FM --.- MHz</span>
                </div>
                <h3 class="text-2xl md:text-3xl font-black uppercase text-white tracking-wide text-glow-pink transition-all duration-300" id="currentStationTitle">
                    Sin Emisora
                </h3>
                <p class="text-xs text-viceCyan/80 font-mono mt-1" id="trackNameDisplay">
                    Carga tus archivos MP3 para iniciar la radio
                </p>
            </div>

            <div class="z-10 flex items-end justify-center gap-1.5 h-12 w-32 px-2 py-1 bg-black/50 border border-vicePink/40 rounded-lg" id="visualizer">
                <div class="equalizer-bar w-2 bg-vicePink rounded-t" style="animation-duration: 0.4s"></div>
                <div class="equalizer-bar w-2 bg-viceCyan rounded-t" style="animation-duration: 0.7s"></div>
                <div class="equalizer-bar w-2 bg-viceYellow rounded-t" style="animation-duration: 0.3s"></div>
                <div class="equalizer-bar w-2 bg-vicePink rounded-t" style="animation-duration: 0.5s"></div>
                <div class="equalizer-bar w-2 bg-viceCyan rounded-t" style="animation-duration: 0.8s"></div>
                <div class="equalizer-bar w-2 bg-viceYellow rounded-t" style="animation-duration: 0.4s"></div>
            </div>

            <div class="z-10 flex flex-col items-center md:items-end gap-2 w-full md:w-auto">
                <div class="flex items-center gap-4">
                    <button id="prevBtn" class="w-10 h-10 rounded-full bg-vicePurple border border-viceCyan text-viceCyan hover:bg-viceCyan hover:text-black transition flex items-center justify-center active:scale-95">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="playPauseBtn" class="w-14 h-14 rounded-full bg-vicePink text-white border-2 border-white glow-pink hover:scale-105 transition flex items-center justify-center text-xl active:scale-95">
                        <i class="fa-solid fa-play" id="playIcon"></i>
                    </button>
                    <button id="nextBtn" class="w-10 h-10 rounded-full bg-vicePurple border border-viceCyan text-viceCyan hover:bg-viceCyan hover:text-black transition flex items-center justify-center active:scale-95">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2 w-48 mt-1">
                    <i class="fa-solid fa-volume-low text-xs text-viceCyan"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-vicePink cursor-pointer h-1.5 bg-black/60 rounded-lg">
                    <i class="fa-solid fa-volume-high text-xs text-viceCyan"></i>
                </div>
            </div>
        </section>

        <section class="bg-black/50 border border-vicePink/40 rounded-xl p-4 backdrop-blur-sm">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-viceYellow text-xl"></i>
                    <div>
                        <h4 class="font-bold text-sm text-white">Archivos de Emisoras Locales</h4>
                        <p class="text-xs text-gray-400">Selecciona la carpeta o audios de tu Android</p>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-end">
                    <label class="flex-1 sm:flex-none text-center px-3 py-2 text-xs font-bold bg-vicePurple border border-viceCyan text-viceCyan rounded-lg cursor-pointer hover:bg-viceCyan hover:text-black transition active:scale-95 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-folder"></i> Cargar Carpeta
                        <input type="file" id="folderInput" webkitdirectory directory multiple accept="audio/*" class="hidden">
                    </label>
                    
                    <label class="flex-1 sm:flex-none text-center px-3 py-2 text-xs font-bold bg-vicePurple border border-vicePink text-vicePink rounded-lg cursor-pointer hover:bg-vicePink hover:text-white transition active:scale-95 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-audio"></i> Archivos MP3
                        <input type="file" id="filesInput" multiple accept="audio/*" class="hidden">
                    </label>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-3.5" id="stationsGrid">
        </section>

        <section class="bg-black/60 border border-gray-800 rounded-xl p-4 text-xs text-gray-300">
            <div class="flex items-center gap-2 mb-2 text-viceYellow font-bold uppercase tracking-wider">
                <i class="fa-solid fa-mobile-screen-button"></i> Configuración Local en Android (PWA)
            </div>
        </section>

    </main>

    <footer class="w-full text-center text-xs text-gray-500 py-2 border-t border-gray-900">
        Vice City Radio Tuner &bull; PWA Local Android System
    </footer>
</div>


<script>
    const STATIONS = [
        {
            id: 'flash',
            name: 'Flash FM',
            genre: 'Pop / Synthpop',
            freq: '105.8 MHz',
            color: '#ff007f',
            icon: 'fa-bolt-lightning',
            fileMatch: ['flash', 'pop'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'vrock',
            name: 'V-Rock',
            genre: 'Heavy Metal / Hard Rock',
            freq: '99.9 MHz',
            color: '#e63946',
            icon: 'fa-guitar',
            fileMatch: ['vrock', 'v-rock', 'rock'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'wave103',
            name: 'Wave 103',
            genre: 'New Wave / Post-Punk',
            freq: '103.2 MHz',
            color: '#00f0ff',
            icon: 'fa-wave-square',
            fileMatch: ['wave', 'wave103', 'synth'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'emotion',
            name: 'Emotion 98.3',
            genre: 'Power Ballads',
            freq: '98.3 MHz',
            color: '#ff758c',
            icon: 'fa-heart',
            fileMatch: ['emotion', 'ballad'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'wildstyle',
            name: 'Wildstyle Pirate',
            genre: 'Old School Hip Hop / Electro',
            freq: '96.2 MHz',
            color: '#ffea00',
            icon: 'fa-record-vinyl',
            fileMatch: ['wildstyle', 'hiphop', 'rap'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'fever',
            name: 'Fever 105',
            genre: 'Disco / Funk / Soul',
            freq: '105.0 MHz',
            color: '#b5179e',
            icon: 'fa-compact-disc',
            fileMatch: ['fever', 'fever105', 'disco', 'funk'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'espantoso',
            name: 'Radio Espantoso',
            genre: 'Latin Jazz / Salsa',
            freq: '103.7 MHz',
            color: '#00b4d8',
            icon: 'fa-drum',
            fileMatch: ['espantoso', 'latin', 'salsa'],
            audioUrl: null,
            duration: 0
        },
        {
            id: 'vcpr',
            name: 'VCPR / K-Chat',
            genre: 'Talk Radio / News',
            freq: '101.5 MHz',
            color: '#ff9e00',
            icon: 'fa-comments',
            fileMatch: ['vcpr', 'kchat', 'talk', 'chat'],
            audioUrl: null,
            duration: 0
        }
    ];

    let activeStationIndex = -1;
    let isPlaying = false;
    let audioPlayer = new Audio();
    let audioContext = null;

    const stationsGrid = document.getElementById('stationsGrid');
    const currentStationTitle = document.getElementById('currentStationTitle');
    const trackNameDisplay = document.getElementById('trackNameDisplay');
    const freqDisplay = document.getElementById('freqDisplay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const folderInput = document.getElementById('folderInput');
    const filesInput = document.getElementById('filesInput');
    const visualizer = document.getElementById('visualizer');

    function renderStations() {
        stationsGrid.innerHTML = '';
        STATIONS.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = `station-card bg-black/60 border border-gray-800 rounded-xl p-3.5 cursor-pointer flex flex-col items-center text-center transition-all duration-300 hover:border-vicePink hover:scale-105 active:scale-95 relative overflow-hidden`;
            card.id = `station-${index}`;

            const hasAudio = !!station.audioUrl;

            card.innerHTML = `
                <div class="w-12 h-12 rounded-full flex items-center justify-center mb-2 text-xl" style="background-color: ${station.color}20; color: ${station.color}">
                    <i class="fa-solid ${station.icon}"></i>
                </div>
                <h4 class="font-bold text-sm text-white leading-tight">${station.name}</h4>
                <p class="text-[10px] text-gray-400 mt-0.5">${station.genre}</p>
                <div class="mt-2 text-[10px] px-2 py-0.5 rounded font-mono ${hasAudio ? 'bg-viceCyan/20 text-viceCyan' : 'bg-gray-800 text-gray-500'}" id="status-tag-${index}">
                    ${hasAudio ? 'Cargada' : 'Sin Audio'}
                </div>
            `;

            card.addEventListener('click', () => selectStation(index));
            stationsGrid.appendChild(card);
        });
    }

    function playRadioStatic(durationMs = 350) {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            const bufferSize = audioContext.sampleRate * (durationMs / 1000);
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;

            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800;
            filter.Q.value = 2;

            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.20, audioContext.currentTime + (durationMs / 1000));

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioContext.destination);

            noise.start();
            noise.stop(audioContext.currentTime + (durationMs / 1000));
        } catch (e) {
            console.log("Audio FX error:", e);
        }
    }

    function selectStation(index) {
        if (index < 0 || index >= STATIONS.length) return;
        
        const station = STATIONS[index];
        activeStationIndex = index;

        playRadioStatic(900);

        document.querySelectorAll('.station-card').forEach((c, i) => {
            if (i === index) {
                c.classList.add('active');
            } else {
                c.classList.remove('active');
            }
        });

        currentStationTitle.innerText = station.name;
        currentStationTitle.style.color = station.color;
        freqDisplay.innerText = station.freq;

        if (!station.audioUrl) {
            trackNameDisplay.innerText = "Emisora sin audio (Carga un archivo MP3)";
            audioPlayer.pause();
            isPlaying = false;
            updatePlayBtnIcon();
            return;
        }

        audioPlayer.src = station.audioUrl;
        
        audioPlayer.onloadedmetadata = () => {
            applyRandomSeekAndPlay(station);
        };

        if (audioPlayer.readyState >= 1) {
            applyRandomSeekAndPlay(station);
        }
    }

    function applyRandomSeekAndPlay(station) {
        const duration = audioPlayer.duration;
        if (duration && !isNaN(duration) && duration > 0) {
            const randomTime = Math.random() * duration;
            audioPlayer.currentTime = randomTime;
            trackNameDisplay.innerText = `${station.fileName || 'Audio Emisora'} [Sintonizado en ${Math.floor(randomTime)}s]`;
        } else {
            trackNameDisplay.innerText = station.fileName || 'Audio Emisora';
        }

        audioPlayer.play().then(() => {
            isPlaying = true;
            updatePlayBtnIcon();
        }).catch(err => {
            console.warn("Playback error:", err);
            isPlaying = false;
            updatePlayBtnIcon();
        });
    }

    function togglePlay() {
        if (activeStationIndex === -1) {
            selectStation(0);
            return;
        }

        const currentStation = STATIONS[activeStationIndex];
        if (!currentStation.audioUrl) {
            alert("Por favor carga un archivo MP3 para esta emisora primero.");
            return;
        }

        if (isPlaying) {
            audioPlayer.pause();
            isPlaying = false;
        } else {
            audioPlayer.play().then(() => {
                isPlaying = true;
            }).catch(e => console.error(e));
        }
        updatePlayBtnIcon();
    }

    function updatePlayBtnIcon() {
        if (isPlaying) {
            playIcon.className = "fa-solid fa-pause";
            visualizer.classList.remove('opacity-30');
        } else {
            playIcon.className = "fa-solid fa-play";
            visualizer.classList.add('opacity-30');
        }
    }
    function handleFiles(fileList) {
        const files = Array.from(fileList).filter(file => file.type.startsWith('audio/') || file.name.endsWith('.mp3'));

        if (files.length === 0) {
            alert("No se encontraron archivos de audio MP3 válidos.");
            return;
        }

        let assignedCount = 0;

        files.forEach(file => {
            const fileNameLower = file.name.toLowerCase();
            const objectUrl = URL.createObjectURL(file);
            let matched = false;
            STATIONS.forEach((station) => {
                if (!matched) {
                    const matchesKeyword = station.fileMatch.some(keyword => fileNameLower.includes(keyword));
                    if (matchesKeyword) {
                        station.audioUrl = objectUrl;
                        station.fileName = file.name;
                        matched = true;
                        assignedCount++;
                    }
                }
            });

            if (!matched) {
                const unassignedStation = STATIONS.find(s => !s.audioUrl);
                if (unassignedStation) {
                    unassignedStation.audioUrl = objectUrl;
                    unassignedStation.fileName = file.name;
                    assignedCount++;
                }
            }
        });

        renderStations();
        
        const firstAvailableIndex = STATIONS.findIndex(s => s.audioUrl !== null);
        if (firstAvailableIndex !== -1) {
            selectStation(firstAvailableIndex);
        }
    }

    playPauseBtn.addEventListener('click', togglePlay);

    prevBtn.addEventListener('click', () => {
        let nextIndex = activeStationIndex - 1;
        if (nextIndex < 0) nextIndex = STATIONS.length - 1;
        selectStation(nextIndex);
    });

    nextBtn.addEventListener('click', () => {
        let nextIndex = activeStationIndex + 1;
        if (nextIndex >= STATIONS.length) nextIndex = 0;
        selectStation(nextIndex);
    });

    volumeSlider.addEventListener('input', (e) => {
        audioPlayer.volume = e.target.value;
    });

    folderInput.addEventListener('change', (e) => handleFiles(e.target.files));
    filesInput.addEventListener('change', (e) => handleFiles(e.target.files));

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === ' ') {
            e.preventDefault();
            togglePlay();
        }
    });

    audioPlayer.addEventListener('ended', () => {
        if (activeStationIndex !== -1 && STATIONS[activeStationIndex].audioUrl) {
            applyRandomSeekAndPlay(STATIONS[activeStationIndex]);
        }
    });

    window.onload = () => {
        renderStations();
        visualizer.classList.add('opacity-30');
        
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'vc-radio-v1';
                self.addEventListener('install', (event) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (event) => {
                    event.waitUntil(clients.claim());
                });
                self.addEventListener('fetch', (event) => {
                    event.respondWith(fetch(event.request).catch(() => caches.match(event.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Registration bypassed:', err));
        }
    };
</script>
</html>
